sonar.projectKey=operacion-garavito-frontend
sonar.projectName=Operación Garavito - Frontend
sonar.projectVersion=2.0
sonar.host.url=http://localhost:9000

sonar.sources=src
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.test.js,**/public/**
sonar.tests=src
sonar.test.inclusions=**/*.test.js
sonar.sourceEncoding=UTF-8

# Cobertura de las pruebas unitarias (npm run test:coverage, ejecutor de Node).
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Fuera de la COBERTURA (no del analisis: Sonar igual busca bugs, vulnerabilidades y
# code smells en estos archivos). Es el codigo que solo corre en un navegador real
# (Phaser con canvas/WebGL, DOM, Web Audio, WebSocket, gamepad) y que prueban las
# pruebas de punta a punta con Playwright (frontend/e2e), cuya cobertura el ejecutor de
# Node no puede medir. La logica del juego (reglas, catalogos, mapas, estadisticas,
# repeticiones, mezcla de mensajes) si se mide. Detalle en docs/MANTENIBILIDAD.md.
sonar.coverage.exclusions=\
  src/main.jsx,src/App.jsx,\
  src/components/**,\
  src/services/socketService.js,\
  src/game/GameCanvas.jsx,\
  src/game/MainScene.js,src/game/IntroScene.js,\
  src/game/*Layer.js,src/game/*Decor.js,src/game/outsideDecor.js,\
  src/game/Lighting.js,src/game/lightStamps.js,src/game/CharacterRig.js,src/game/walkFrames.js,\
  src/game/*Art.js,src/game/screenFx.js,\
  src/game/ambience.js,src/game/audioBank.js,src/game/music.js,src/game/sfx.js,src/game/voice.js,\
  src/game/gameSync.js,src/game/gameModes.js,src/game/gamepad.js,src/game/replayRecorder.js
