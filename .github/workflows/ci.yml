# Integracion continua: en cada push y PR corre las pruebas del backend (incluidas las
# de ataque de backend/src/test/.../security), el lint, las pruebas y el build del
# frontend, las pruebas de punta a punta (Playwright), una prueba de carga corta con k6
# que falla si el juego se pone lento (umbrales en k6/partidas.js, ver docs/k6) y la
# revision de dependencias con vulnerabilidades conocidas (ver docs/SEGURIDAD.md).
name: CI

on:
  push:
    branches: [main, develop, 'feat/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Pruebas
        run: ./mvnw -B test
      - name: Reporte de pruebas
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: surefire-reports
          path: backend/target/surefire-reports

  frontend:
    name: Frontend (lint, pruebas, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Falla con vulnerabilidades altas o criticas en las dependencias de npm.
      - name: npm audit
        run: npm audit --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Pruebas unitarias
        run: npm test
      - name: Build
        run: npm run build

  dependencias:
    name: Dependencias del backend (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Trivy lee las dependencias (con las transitivas) del repositorio local de Maven:
      # si las pide el mismo a Maven Central, este responde 429 al runner.
      - name: Descargar las dependencias al repositorio local
        working-directory: backend
        run: ./mvnw -B -q dependency:go-offline
      # Equivalente a OWASP dependency-check: cruza las dependencias de pom.xml con las
      # bases de vulnerabilidades. Falla con vulnerabilidades altas o criticas que ya
      # tengan version arreglada. Imagen oficial de Docker (el runner trae Docker).
      - name: Vulnerabilidades conocidas en backend/pom.xml
        run: |
          docker run --rm -v "$PWD/backend:/src:ro" -v "$HOME/.m2:/root/.m2:ro" aquasec/trivy:latest fs \
            --offline-scan --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 /src

  ataques:
    name: Ataques (pentest contra el backend de produccion)
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      # Sin perfil dev (que acepta cualquier Origin): la configuracion de produccion,
      # con H2 en vez de PostgreSQL.
      - name: Levantar backend como en produccion
        working-directory: backend
        run: |
          ./mvnw -B -q package -DskipTests
          WS_ALLOWED_ORIGINS=https://www.operaciongaravito.me nohup java -jar target/*.jar \
            --spring.datasource.url=jdbc:h2:mem:pentest --spring.datasource.driver-class-name=org.h2.Driver \
            --spring.datasource.username=sa --spring.datasource.password= > ../backend-pentest.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/api/ping > /dev/null && exit 0
            sleep 2
          done
          cat ../backend-pentest.log
          exit 1
      - name: Correr los ataques (falla si alguno pasa)
        run: node frontend/scripts/pentest.mjs http://localhost:8080
      - name: Log del backend
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: backend-pentest-log
          path: backend-pentest.log

  e2e:
    name: Punta a punta (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Pruebas e2e (levantan backend y frontend solas)
        run: npm run test:e2e
      - name: Trazas de fallos
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: frontend/test-results

  carga:
    name: Carga (k6, perfil humo)
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Perfil carga: los jugadores falsos de k6 eligen el codigo de su sala y salen todos
      # de la misma maquina; en produccion los limites de abuso no lo dejarian.
      - name: Levantar backend (perfiles dev y carga)
        working-directory: backend
        run: |
          ./mvnw -B -q package -DskipTests
          nohup java -jar target/*.jar --spring.profiles.active=dev,carga > ../backend.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/actuator/health && exit 0
            sleep 2
          done
          cat ../backend.log
          exit 1
      - name: Instalar k6
        run: |
          curl -sSfL https://github.com/grafana/k6/releases/download/v0.54.0/k6-v0.54.0-linux-amd64.tar.gz | tar xz
          sudo mv k6-v0.54.0-linux-amd64/k6 /usr/local/bin/k6
          k6 version
      # Si no se cumple algun umbral (k6/partidas.js), k6 sale con codigo 99 y el job falla.
      - name: Prueba de carga
        run: k6 run -e PERFIL=humo -e SESION_S=30 --summary-export=k6-resumen.json k6/partidas.js
      - name: Resumen en la pagina del job
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          if not os.path.exists('k6-resumen.json'):
              print('k6 no genero resumen.'); raise SystemExit
          m = json.load(open('k6-resumen.json'))['metrics']
          def fila(nombre, clave, valor, umbral):
              ok = all(not v for v in m.get(clave, {}).get('thresholds', {}).values())
              print(f"| {nombre} | {valor} | {umbral} | {'✅' if ok else '❌'} |")
          print('### Prueba de carga (k6, perfil humo)\n')
          print('| Medida | Valor | Umbral | |\n|---|---|---|---|')
          e = m['entrada_exitosa']
          fila('Jugadores que entraron', 'entrada_exitosa', f"{e['value']*100:.0f} % ({e['passes']} de {e['passes']+e['fails']})", '> 95 %')
          fila('Intervalo de estado p95', 'intervalo_estado_ms', f"{m['intervalo_estado_ms']['p(95)']:.0f} ms", '< 250 ms')
          fila('Ida y vuelta del movimiento p95', 'ida_y_vuelta_movimiento_ms', f"{m['ida_y_vuelta_movimiento_ms']['p(95)']:.0f} ms", '< 300 ms')
          fila('Errores HTTP', 'http_req_failed', f"{m['http_req_failed']['value']*100:.1f} %", '< 1 %')
          PY
      - name: Reporte y log del backend
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: k6-humo
          path: |
            k6-resumen.json
            backend.log
