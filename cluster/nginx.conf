# Balanceador delante de los nodos del backend (docker-compose.cluster.yml).
#
# Reparte cada conexion nueva entre los nodos. Las peticiones de una misma sesion de
# SockJS (/ws/<servidor>/<sesion>/<transporte>) van siempre al mismo nodo, para que
# funcionen tambien los transportes de respaldo (xhr-streaming) y no solo el WebSocket.
# Si una sala vive en el otro nodo, el backend responde LOBBY_REDIRECT y el cliente se
# conecta directo a ese nodo (NODE_PUBLIC_URL).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $uri $afinidad {
    ~^/ws/[^/]+/(?<sesion>[^/]+)/ $sesion;
    default                       $request_id;
}

upstream backend {
    hash $afinidad consistent;
    server node1:8080;
    server node2:8080;
}

server {
    listen 8080;

    location / {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Si un nodo no responde (por ejemplo, se cayo), se pasa al otro enseguida.
        proxy_connect_timeout 2s;
        # Las partidas tienen la conexion abierta minutos sin peticiones nuevas.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
