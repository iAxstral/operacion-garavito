global:
  scrape_interval: 5s

scrape_configs:
  # Cada nodo del backend. Con varios nodos (docker-compose.cluster.yml) se agregan aqui.
  - job_name: garavito
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels:
          node: local
      # Con docker-compose.cluster.yml (dos nodos en 8081 y 8082):
      # - targets: ["host.docker.internal:8081"]
      #   labels: { node: nodo-1 }
      # - targets: ["host.docker.internal:8082"]
      #   labels: { node: nodo-2 }
