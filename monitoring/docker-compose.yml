# Monitoreo de Operación Garavito: Prometheus lee /actuator/prometheus del backend y
# Grafana muestra el tablero "Operación Garavito" ya configurado.
#
#   1. Levantar el backend (por defecto en el puerto 8080).
#   2. docker compose -f monitoring/docker-compose.yml up -d
#   3. Grafana en http://localhost:3000 (admin / garavito), Prometheus en :9090.
#
# Si el backend corre en otro puerto u otra máquina, cambiar el destino en prometheus.yml.

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: garavito
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
