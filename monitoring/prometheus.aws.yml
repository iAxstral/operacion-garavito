# Prometheus del despliegue en AWS (infra/): corre en la misma EC2 que el backend y lo
# lee por localhost, asi /actuator nunca queda expuesto a internet.
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: garavito
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["localhost:8080"]
        labels:
          node: aws
