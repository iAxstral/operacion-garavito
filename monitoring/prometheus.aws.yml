# Prometheus del despliegue en AWS (infra/): corre en la misma EC2 que el backend y lo
# lee por localhost:9091 (puerto de management, solo 127.0.0.1), asi /actuator nunca queda expuesto a internet.
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: garavito
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["localhost:9091"]
        labels:
          node: aws
