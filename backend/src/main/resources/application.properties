spring.application.name=operacion-garavito

# Configuración por defecto: PostgreSQL para despliegue (Railway o similar).
# Para desarrollo local sin Postgres instalado, usar el perfil `dev`
# (application-dev.properties, respaldado por H2 en memoria) — ver README.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/operaciongaravito}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
# Las consultas se resuelven en el servicio; no hace falta tener la sesion abierta en la vista.
spring.jpa.open-in-view=false

# Monitoreo: /actuator/health y /actuator/prometheus (lo lee Prometheus, ver monitoring/).
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.metrics.tags.application=operacion-garavito
# Redis solo se usa con el perfil cluster (application-cluster.properties).
management.health.redis.enabled=false

# Orígenes que pueden abrir el WebSocket /ws (separados por coma). En
# despliegue, fijar WS_ALLOWED_ORIGINS con la URL pública del frontend.
app.websocket.allowed-origins=${WS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,http://192.168.*.*:*,http://10.*.*.*:*,http://172.*.*.*:*}

# IA del jefe "Ingeniero de Sistemas" (Kinder 5). Distancias en tiles de 64 px.
game.boss.detection-radius-tiles=8
game.boss.attack-radius-tiles=1
game.boss.repath-ms=500
game.boss.alert-ms=600
game.boss.stun-ms=1500
game.boss.lose-target-ms=3000
game.boss.speed-px-per-second=115
game.boss.max-health=24
game.boss.bite-damage=12
game.boss.attack-cooldown-ms=900

# ---------- Seguridad de las APIs (ver docs/SEGURIDAD.md) ----------
# Valores de produccion. El perfil "carga" (application-carga.properties) los afloja
# para k6 y frontend/scripts/load-test.mjs.
# Limite de mensajes STOMP por conexion (token bucket). El cliente manda ~10/s.
security.ratelimit.enabled=true
security.ratelimit.messages-per-second=40
security.ratelimit.burst=80
security.ratelimit.max-violations=200
security.ratelimit.violation-window-ms=10000
security.stomp.max-subscriptions=4
# Transporte WebSocket
security.ws.message-size-limit=8192
security.ws.send-buffer-size-limit=524288
security.ws.send-time-limit-ms=10000
security.ws.time-to-first-message-ms=10000
# Salas: topes, vida de una sala vacia y codigo generado por el servidor
security.rooms.max-per-node=200
security.rooms.max-per-connection=3
security.rooms.max-per-ip=20
security.rooms.ip-window-ms=600000
security.rooms.empty-ttl-ms=60000
security.rooms.client-codes-allowed=false
security.rooms.code-length=6
# Detras de CloudFront: IP real en X-Forwarded-For (solo con el filtro de origen activo)
security.trust-forwarded-for=${SECURITY_TRUST_FORWARDED_FOR:false}
