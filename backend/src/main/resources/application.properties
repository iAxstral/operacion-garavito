spring.application.name=operacion-garavito

# Configuración por defecto: PostgreSQL para despliegue (Railway o similar).
# Para desarrollo local sin Postgres instalado, usar el perfil `dev`
# (application-dev.properties, respaldado por H2 en memoria) — ver README.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/operaciongaravito}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate

# Orígenes que pueden abrir el WebSocket /ws (separados por coma). En
# despliegue, fijar WS_ALLOWED_ORIGINS con la URL pública del frontend.
app.websocket.allowed-origins=${WS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,http://192.168.*.*:*,http://10.*.*.*:*,http://172.*.*.*:*}
