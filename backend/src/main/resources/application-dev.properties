# Perfil de desarrollo local: base de datos H2 en memoria, sin depender de
# una instancia de PostgreSQL corriendo. Activar con:
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
# o
#   java -jar target/*.jar --spring.profiles.active=dev
spring.datasource.url=jdbc:h2:mem:garavito;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update

# Consola web de H2 para inspeccionar la base en memoria durante desarrollo.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# En local se acepta cualquier origen (Vite en 5173, preview en 4173, etc.).
app.websocket.allowed-origins=*
