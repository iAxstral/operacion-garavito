# Pruebas de carga (k6/partidas.js y frontend/scripts/load-test.mjs). Se suma a otro
# perfil: --spring.profiles.active=dev,carga
#
# Muchos jugadores falsos desde la misma maquina, que eligen el codigo de su sala para
# encontrarse sin hablar entre ellos: se desactivan los limites de abuso.
security.ratelimit.enabled=false
security.rooms.client-codes-allowed=true
security.rooms.max-per-node=5000
security.rooms.max-per-connection=1000
security.rooms.max-per-ip=1000000
