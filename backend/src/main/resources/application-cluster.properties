# Varios nodos detras de un balanceador (ver docker-compose.cluster.yml y docs/ESCALABILIDAD.md).
# Cada nodo publica su URL para que los clientes que piden una sala de otro nodo se
# reconecten alla, y el registro sala -> nodo vive en Redis.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
app.node.public-url=${NODE_PUBLIC_URL:http://localhost:8080}
management.health.redis.enabled=true
management.metrics.tags.node=${NODE_NAME:nodo}
